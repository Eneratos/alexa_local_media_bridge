name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check version consistency
        run: python3 scripts/check_version.py

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: skill/lambda/package-lock.json

      - name: Check Python syntax
        run: python -m compileall -q bridge/app

      - name: Check shell syntax
        run: |
          for script in scripts/*.sh
          do
            echo "Checking $script"
            bash -n "$script"
          done

      - name: Install Lambda dependencies
        working-directory: skill/lambda
        run: npm ci --omit=dev

      - name: Check Lambda syntax
        working-directory: skill/lambda
        run: node --check index.js

      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = sorted(Path(".").rglob("*.json"))

          if not files:
              raise SystemExit("No JSON files found.")

          for path in files:
              with path.open(
                  "r",
                  encoding="utf-8",
              ) as handle:
                  json.load(handle)

              print(f"Valid: {path}")

          print(f"Validated {len(files)} JSON files.")
          PY

      - name: Test localized launch responses
        env:
          BRIDGE_BASE_URL: https://media.example.com
          CONTROL_SECRET: 0123456789abcdef0123456789abcdef
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { handler } = require(
              './skill/lambda/index.js'
          );

          const tests = [
              {
                  file:
                      'skill/test_events/launch_de_DE.json',
                  expected:
                      'Was möchtest du hören?'
              },
              {
                  file:
                      'skill/test_events/launch_en_US.json',
                  expected:
                      'What would you like to listen to?'
              }
          ];

          (async () => {
              for (const test of tests) {
                  const event = JSON.parse(
                      fs.readFileSync(
                          test.file,
                          'utf8'
                      )
                  );

                  const response = await handler(event);
                  const ssml =
                      response.response
                          .outputSpeech
                          .ssml;

                  if (!ssml.includes(test.expected)) {
                      throw new Error(
                          `${test.file} returned: ${ssml}`
                      );
                  }

                  console.log(`Passed: ${test.file}`);
              }
          })().catch((error) => {
              console.error(error);
              process.exit(1);
          });
          NODE

      - name: Validate Compose configuration
        run: |
          cp bridge/.env.example bridge/.env
          docker compose \
            --env-file bridge/.env.example \
            --file bridge/compose.yml \
            config \
            --no-env-resolution \
            >/dev/null

      - name: Build bridge image
        run: |
          docker build \
            --tag alexa-local-media-bridge:ci \
            bridge

      - name: Test configuration validation
        run: |
          set +e

          output="$(
            docker run --rm \
              alexa-local-media-bridge:ci \
              2>&1
          )"

          status=$?
          set -e

          printf '%s\n' "$output"

          test "$status" -eq 2
          grep -q \
            '^Configuration error:' \
            <<<"$output"

      - name: Test bridge container
        run: |
          set -Eeuo pipefail

          cleanup() {
            docker logs \
              alexa-local-media-bridge-ci \
              2>/dev/null || true

            docker rm -f \
              alexa-local-media-bridge-ci \
              >/dev/null 2>&1 || true
          }

          trap cleanup EXIT

          docker run -d \
            --name alexa-local-media-bridge-ci \
            --read-only \
            --tmpfs /tmp:size=16m,mode=1777 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --publish 127.0.0.1:18000:8000 \
            --env STREAM_SECRET="0123456789abcdef0123456789abcdef" \
            --env CONTROL_SECRET="fedcba9876543210fedcba9876543210" \
            --env PUBLIC_BASE_URL="https://media.example.com" \
            --env NAVIDROME_URL="http://navidrome:4533" \
            --env NAVIDROME_USERNAME_B64="dGVzdA==" \
            --env NAVIDROME_PASSWORD_B64="dGVzdA==" \
            --env AUDIOBOOKSHELF_URL="http://audiobookshelf:80" \
            --env AUDIOBOOKSHELF_TOKEN_B64="dGVzdA==" \
            --env AUDIOBOOKSHELF_LIBRARY_ID="test-library" \
            alexa-local-media-bridge:ci

          ready=0

          for _ in $(seq 1 30)
          do
            if curl -fsS \
              http://127.0.0.1:18000/health \
              >health.json
            then
              ready=1
              break
            fi

            sleep 1
          done

          test "$ready" -eq 1
          grep -q '"status":"ok"' health.json

          health=""

          for _ in $(seq 1 40)
          do
            health="$(
              docker inspect \
                --format \
                '{{.State.Health.Status}}' \
                alexa-local-media-bridge-ci
            )"

            if [[ "$health" == "healthy" ]]; then
              break
            fi

            sleep 2
          done

          test "$health" = "healthy"

          uid="$(
            docker exec \
              alexa-local-media-bridge-ci \
              python -c \
              'import os; print(os.getuid())'
          )"

          test "$uid" != "0"

          read_only="$(
            docker inspect \
              --format \
              '{{.HostConfig.ReadonlyRootfs}}' \
              alexa-local-media-bridge-ci
          )"

          test "$read_only" = "true"

          cap_drop="$(
            docker inspect \
              --format \
              '{{json .HostConfig.CapDrop}}' \
              alexa-local-media-bridge-ci
          )"

          grep -q '"ALL"' <<<"$cap_drop"

  lambda-package:
    name: Build Lambda package
    runs-on: ubuntu-latest
    needs:
      - validate

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: skill/lambda/package-lock.json

      - name: Prepare Lambda package
        run: |
          mkdir -p dist/lambda

          cp \
            skill/lambda/index.js \
            skill/lambda/package.json \
            skill/lambda/package-lock.json \
            LICENSE \
            dist/lambda/

          npm ci \
            --omit=dev \
            --prefix dist/lambda

          node --check dist/lambda/index.js

      - name: Create flat Lambda ZIP
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path

          source = Path("dist/lambda")
          target = Path(
              "dist/"
              "alexa_local_media_bridge_lambda_ci.zip"
          )

          with zipfile.ZipFile(
              target,
              "w",
              zipfile.ZIP_DEFLATED,
          ) as archive:
              for path in sorted(
                  source.rglob("*")
              ):
                  if path.is_file():
                      archive.write(
                          path,
                          path.relative_to(source),
                      )

          print(f"Created: {target}")
          PY

      - name: Verify Lambda ZIP
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path

          path = Path(
              "dist/"
              "alexa_local_media_bridge_lambda_ci.zip"
          )

          required = {
              "index.js",
              "package.json",
              "package-lock.json",
              "LICENSE",
              "node_modules/ask-sdk-core/package.json",
          }

          with zipfile.ZipFile(path) as archive:
              names = set(archive.namelist())

          missing = sorted(required - names)

          if missing:
              raise SystemExit(
                  "Missing Lambda ZIP entries: "
                  + ", ".join(missing)
              )

          forbidden = [
              name
              for name in names
              if name.startswith("lambda/")
              or name.startswith("dist/")
          ]

          if forbidden:
              raise SystemExit(
                  "Lambda ZIP contains a wrapper directory."
              )

          print("Lambda ZIP structure is valid.")
          print(f"Files: {len(names)}")
          PY

      - name: Create checksum
        run: |
          cd dist

          sha256sum \
            alexa_local_media_bridge_lambda_ci.zip \
            >alexa_local_media_bridge_lambda_ci.zip.sha256

          sha256sum \
            --check \
            alexa_local_media_bridge_lambda_ci.zip.sha256

      - name: Upload Lambda package
        uses: actions/upload-artifact@v7
        with:
          name: lambda-package
          path: |
            dist/alexa_local_media_bridge_lambda_ci.zip
            dist/alexa_local_media_bridge_lambda_ci.zip.sha256
          if-no-files-found: error
